<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaTune Vote · Neo Brutalism 7 Tema</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== TEMA 1: PUTIH MONO (default) ===== */
    :root {
      --bg-page: #f5f5f5;
      --bg-card: #ffffff;
      --border: #000000;
      --shadow: #000000;
      --text-primary: #000000;
      --text-secondary: #222222;
      --terminal-bg: #ffffff;
      --terminal-border: #000000;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --btn-hover-bg: #000000;
      --btn-hover-text: #ffffff;
      --tag-bg: #ffffff;
      --tag-text: #000000;
      --brand-bg: #000000;
      --brand-text: #ffffff;
    }

    /* ===== TEMA 2: KUNING ===== */
    body.theme-kuning {
      --bg-page: #fff9c4; --bg-card: #fffde7;
      --border: #1a1a00; --shadow: #1a1a00;
      --text-primary: #1a1a00; --text-secondary: #3a3a00;
      --terminal-bg: #fffde7; --terminal-border: #1a1a00;
      --btn-bg: #ffe600; --btn-text: #1a1a00;
      --btn-hover-bg: #1a1a00; --btn-hover-text: #ffe600;
      --tag-bg: #ffe600; --tag-text: #1a1a00;
      --brand-bg: #ffe600; --brand-text: #1a1a00;
    }

    /* ===== TEMA 3: HIJAU ===== */
    body.theme-hijau {
      --bg-page: #e8f5e9; --bg-card: #f1f8e9;
      --border: #0d3b0d; --shadow: #0d3b0d;
      --text-primary: #0d3b0d; --text-secondary: #1b5e20;
      --terminal-bg: #f1f8e9; --terminal-border: #0d3b0d;
      --btn-bg: #69f0ae; --btn-text: #0d3b0d;
      --btn-hover-bg: #0d3b0d; --btn-hover-text: #69f0ae;
      --tag-bg: #69f0ae; --tag-text: #0d3b0d;
      --brand-bg: #69f0ae; --brand-text: #0d3b0d;
    }

    /* ===== TEMA 4: PINK ===== */
    body.theme-pink {
      --bg-page: #fce4ec; --bg-card: #fff0f5;
      --border: #4a0033; --shadow: #4a0033;
      --text-primary: #4a0033; --text-secondary: #7a0055;
      --terminal-bg: #fff0f5; --terminal-border: #4a0033;
      --btn-bg: #ff80ab; --btn-text: #4a0033;
      --btn-hover-bg: #4a0033; --btn-hover-text: #ff80ab;
      --tag-bg: #ff80ab; --tag-text: #4a0033;
      --brand-bg: #ff80ab; --brand-text: #4a0033;
    }

    /* ===== TEMA 5: BIRU ===== */
    body.theme-biru {
      --bg-page: #e3f2fd; --bg-card: #f0f8ff;
      --border: #002b4a; --shadow: #002b4a;
      --text-primary: #002b4a; --text-secondary: #004d80;
      --terminal-bg: #f0f8ff; --terminal-border: #002b4a;
      --btn-bg: #4fc3f7; --btn-text: #002b4a;
      --btn-hover-bg: #002b4a; --btn-hover-text: #4fc3f7;
      --tag-bg: #4fc3f7; --tag-text: #002b4a;
      --brand-bg: #4fc3f7; --brand-text: #002b4a;
    }

    /* ===== TEMA 6: ORANGE ===== */
    body.theme-orange {
      --bg-page: #fff3e0; --bg-card: #fff8f0;
      --border: #4a1a00; --shadow: #4a1a00;
      --text-primary: #4a1a00; --text-secondary: #7a2a00;
      --terminal-bg: #fff8f0; --terminal-border: #4a1a00;
      --btn-bg: #ffab40; --btn-text: #4a1a00;
      --btn-hover-bg: #4a1a00; --btn-hover-text: #ffab40;
      --tag-bg: #ffab40; --tag-text: #4a1a00;
      --brand-bg: #ffab40; --brand-text: #4a1a00;
    }

    /* ===== TEMA 7: UNGU ===== */
    body.theme-ungu {
      --bg-page: #f3e5f5; --bg-card: #faf0ff;
      --border: #2a0033; --shadow: #2a0033;
      --text-primary: #2a0033; --text-secondary: #4a0060;
      --terminal-bg: #faf0ff; --terminal-border: #2a0033;
      --btn-bg: #ce93d8; --btn-text: #2a0033;
      --btn-hover-bg: #2a0033; --btn-hover-text: #ce93d8;
      --tag-bg: #ce93d8; --tag-text: #2a0033;
      --brand-bg: #ce93d8; --brand-text: #2a0033;
    }

    /* ===== MODE GELAP ===== */
    body.dark {
      --bg-page: #1a1a1a !important;
      --bg-card: #2d2d2d !important;
      --border: #ffffff !important;
      --shadow: #ffffff !important;
      --text-primary: #ffffff !important;
      --text-secondary: #e0e0e0 !important;
      --terminal-bg: #1e1e1e !important;
      --terminal-border: #ffffff !important;
      --btn-bg: #1e1e1e !important;
      --btn-text: #ffffff !important;
      --btn-hover-bg: #ffffff !important;
      --btn-hover-text: #000000 !important;
      --tag-bg: #2d2d2d !important;
      --tag-text: #ffffff !important;
      --brand-bg: #ffffff !important;
      --brand-text: #000000 !important;
    }

    body {
      background: var(--bg-page);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      transition: background 0.2s ease, color 0.2s ease;
      color: var(--text-primary);
    }

    .brutal-card {
      background: var(--bg-card);
      border: 4px solid var(--border);
      box-shadow: 12px 12px 0 var(--shadow);
      padding: 2rem 2rem 1.5rem;
      max-width: 750px;
      width: 100%;
      transition: all 0.15s ease;
    }

    /* ===== THEME SWITCHER ===== */
    .theme-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid var(--border);
    }

    .theme-btn {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--shadow);
      cursor: pointer;
      transition: all 0.1s ease;
      padding: 0;
      outline: none;
    }
    .theme-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--shadow); }
    .theme-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
    .theme-btn.active { outline: 3px solid var(--text-primary); outline-offset: 2px; }

    .theme-btn[data-theme="putih"] { background: #ffffff; }
    .theme-btn[data-theme="kuning"] { background: #ffe600; }
    .theme-btn[data-theme="hijau"] { background: #69f0ae; }
    .theme-btn[data-theme="pink"] { background: #ff80ab; }
    .theme-btn[data-theme="biru"] { background: #4fc3f7; }
    .theme-btn[data-theme="orange"] { background: #ffab40; }
    .theme-btn[data-theme="ungu"] { background: #ce93d8; }

    /* ===== HEADER ===== */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      background: var(--brand-bg);
      color: var(--brand-text);
      padding: 0.3rem 0.8rem;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--shadow);
      display: inline-block;
      transition: all 0.15s ease;
    }

    .mode-toggle {
      background: var(--bg-card);
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--shadow);
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s ease;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .mode-toggle:hover {
      background: var(--text-primary);
      color: var(--bg-card);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--shadow);
    }
    .mode-toggle:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }

    /* ===== TAG ===== */
    .tag {
      display: inline-block;
      background: var(--tag-bg);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--shadow);
      padding: 0.25rem 0.8rem;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      color: var(--tag-text);
    }

    /* ===== TITLE ===== */
    .main-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: -1px;
      color: var(--text-primary);
    }
    .main-title span {
      display: inline-block;
      background: var(--text-primary);
      color: var(--bg-card);
      padding: 0 0.4rem;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--shadow);
    }

    /* ===== EDIT TEXT (BISA DIKETIK) ===== */
    .edit-text {
      margin-bottom: 1.5rem;
      border-left: 4px solid var(--border);
      padding-left: 1rem;
    }

    .edit-label {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      display: block;
    }

    .edit-area {
      width: 100%;
      min-height: 70px;
      background: var(--bg-page);
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--shadow);
      padding: 0.75rem 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
      outline: none;
      resize: vertical;
      transition: all 0.15s ease;
      line-height: 1.5;
    }
    .edit-area:focus {
      box-shadow: 6px 6px 0 var(--shadow);
      transform: translate(-1px, -1px);
    }
    .edit-area::placeholder {
      color: var(--text-secondary);
      opacity: 0.5;
      font-style: italic;
    }

    .edit-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-mini {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--shadow);
      padding: 0.4rem 1rem;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s ease;
      letter-spacing: 0.5px;
    }
    .btn-mini:hover {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--shadow);
    }
    .btn-mini:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shadow);
    }

    .save-status {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      margin-left: auto;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .save-status.show { opacity: 1; }

    /* ===== VOTING BUTTON ===== */
    .btn-voting {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0 var(--shadow);
      padding: 1rem 2.5rem;
      font-family: inherit;
      font-weight: 900;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.1s ease;
      margin-bottom: 1.5rem;
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    .btn-voting:hover {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
      transform: translate(-3px, -3px);
      box-shadow: 11px 11px 0 var(--shadow);
    }
    .btn-voting:active {
      transform: translate(3px, 3px);
      box-shadow: 4px 4px 0 var(--shadow);
    }
    .btn-voting:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: 6px 6px 0 var(--shadow);
      background: var(--bg-card);
      color: var(--text-secondary);
    }

    /* ===== TERMINAL ===== */
    .terminal-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .terminal {
      background: var(--terminal-bg);
      border: 4px solid var(--terminal-border);
      box-shadow: 6px 6px 0 var(--shadow);
      padding: 1.2rem 1.5rem;
      width: 100%;
      max-width: 500px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
      text-align: center;
      transition: all 0.2s ease;
      word-break: break-word;
    }
    .terminal.blink { animation: blinkBorder 1s step-end infinite; }
    @keyframes blinkBorder {
      0%, 100% { border-color: var(--terminal-border); }
      50% { border-color: transparent; }
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
      100% { content: ''; }
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      border-top: 3px solid var(--border);
      padding-top: 1rem;
      margin-top: 0.5rem;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }
    .footer strong {
      background: var(--text-primary);
      color: var(--bg-card);
      padding: 0.2rem 0.6rem;
      border: 2px solid var(--border);
      display: inline-block;
      margin-left: 0.3rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .brutal-card { padding: 1.5rem 1rem; box-shadow: 8px 8px 0 var(--shadow); }
      .main-title { font-size: 1.6rem; }
      .btn-voting { font-size: 1rem; padding: 0.9rem 1.5rem; box-shadow: 6px 6px 0 var(--shadow); }
      .terminal { font-size: 0.95rem; padding: 1rem; }
      .brand { font-size: 1.1rem; }
      .theme-btn { width: 30px; height: 30px; }
    }
  </style>
</head>
<body class="theme-putih">

  <div class="brutal-card">
    <!-- THEME SWITCHER -->
    <div class="theme-switcher" id="themeSwitcher">
      <button class="theme-btn active" data-theme="putih" title="Putih Mono"></button>
      <button class="theme-btn" data-theme="kuning" title="Kuning Cerah"></button>
      <button class="theme-btn" data-theme="hijau" title="Hijau Neon"></button>
      <button class="theme-btn" data-theme="pink" title="Pink Pop"></button>
      <button class="theme-btn" data-theme="biru" title="Biru Laut"></button>
      <button class="theme-btn" data-theme="orange" title="Orange Fiery"></button>
      <button class="theme-btn" data-theme="ungu" title="Ungu Galaxy"></button>
    </div>

    <!-- HEADER -->
    <div class="header-row">
      <div class="brand">⚡ NEXATUNE</div>
      <button class="mode-toggle" id="modeToggle" aria-label="Ganti mode">
        <span id="modeIcon">🌙</span> <span id="modeLabel">DARK</span>
      </button>
    </div>

    <!-- TAG -->
    <div class="tag">LINEAR 1 · NEXATUNE VOTE</div>

    <!-- TITLE -->
    <h1 class="main-title">
      <span>LINK VOTE</span> SLURAN
    </h1>

    <!-- ===== EDIT TEXT: SEKARANG BISA DIKETIK ===== -->
    <div class="edit-text">
      <label class="edit-label" for="editArea">📝 Editteks (klik & ketik):</label>
      <textarea
        id="editArea"
        class="edit-area"
        placeholder="Ketik teks edit di sini... contoh: #VoteSluran · #NexaTune"
        maxlength="200"
        spellcheck="false"
      >#VoteSluran · #NexaTune</textarea>
      <div class="edit-actions">
        <button class="btn-mini" id="btnSimpan">💾 Simpan</button>
        <button class="btn-mini" id="btnReset">↺ Reset</button>
        <span class="save-status" id="saveStatus">✅ Tersimpan</span>
      </div>
    </div>

    <!-- VOTING BUTTON -->
    <button class="btn-voting" id="voteBtn">🗳️ VOTING</button>

    <!-- TERMINAL -->
    <div class="terminal-wrapper">
      <div class="terminal" id="terminal">⏳ MENUNGGU PERINTAH<span class="dots"></span></div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      PEMBUAT BASE : <strong>SELAX OFFICIAL</strong>
    </div>
  </div>

  <script>
    (function() {
      const body = document.body;
      const modeToggle = document.getElementById('modeToggle');
      const modeIcon = document.getElementById('modeIcon');
      const modeLabel = document.getElementById('modeLabel');
      const voteBtn = document.getElementById('voteBtn');
      const terminal = document.getElementById('terminal');
      const themeBtns = document.querySelectorAll('.theme-btn');

      // ===== EDIT TEXT ELEMENTS =====
      const editArea = document.getElementById('editArea');
      const btnSimpan = document.getElementById('btnSimpan');
      const btnReset = document.getElementById('btnReset');
      const saveStatus = document.getElementById('saveStatus');

      const THEMES = ['putih', 'kuning', 'hijau', 'pink', 'biru', 'orange', 'ungu'];
      const DARK_KEY = 'nexatune-dark';
      const THEME_KEY = 'nexatune-theme';
      const EDIT_KEY = 'nexatune-edittext';
      const EDIT_DEFAULT = '#VoteSluran · #NexaTune';

      let isDark = false;
      let currentTheme = 'putih';

      // ===== LOAD PREFERENSI =====
      try {
        const savedDark = localStorage.getItem(DARK_KEY);
        const savedTheme = localStorage.getItem(THEME_KEY);
        const savedEdit = localStorage.getItem(EDIT_KEY);
        if (savedTheme && THEMES.includes(savedTheme)) currentTheme = savedTheme;
        if (savedDark === 'true') isDark = true;
        if (savedEdit !== null) editArea.value = savedEdit;
      } catch (e) { /* ignore */ }

      // ===== APPLY THEME =====
      function applyTheme(themeName) {
        THEMES.forEach(t => body.classList.remove('theme-' + t));
        body.classList.add('theme-' + themeName);
        currentTheme = themeName;
        themeBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.theme === themeName);
        });
        try { localStorage.setItem(THEME_KEY, themeName); } catch (e) {}
      }

      // ===== APPLY DARK =====
      function applyDarkMode(dark) {
        isDark = dark;
        body.classList.toggle('dark', dark);
        modeIcon.textContent = dark ? '☀️' : '🌙';
        modeLabel.textContent = dark ? 'LIGHT' : 'DARK';
        try { localStorage.setItem(DARK_KEY, dark ? 'true' : 'false'); } catch (e) {}
      }

      // ===== EDIT TEXT FUNCTIONS =====
      let saveTimer = null;

      function showSaveStatus() {
        saveStatus.classList.add('show');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          saveStatus.classList.remove('show');
        }, 2000);
      }

      function saveEdit() {
        const val = editArea.value.trim() || EDIT_DEFAULT;
        editArea.value = val;
        try {
          localStorage.setItem(EDIT_KEY, val);
          showSaveStatus();
        } catch (e) {
          alert('Gagal simpan ke localStorage');
        }
      }

      function resetEdit() {
        editArea.value = EDIT_DEFAULT;
        try { localStorage.setItem(EDIT_KEY, EDIT_DEFAULT); } catch (e) {}
        showSaveStatus();
        editArea.focus();
      }

      // Tombol Simpan & Reset
      btnSimpan.addEventListener('click', saveEdit);
      btnReset.addEventListener('click', resetEdit);

      // Auto-save saat user berhenti mengetik (debounce 800ms)
      let autoSaveTimer = null;
      editArea.addEventListener('input', function() {
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(saveEdit, 800);
      });

      // Ctrl+S untuk simpan cepat
      editArea.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveEdit();
        }
      });

      // ===== INIT =====
      applyTheme(currentTheme);
      applyDarkMode(isDark);

      // ===== EVENT: TEMA =====
      themeBtns.forEach(btn => {
        btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
      });

      // ===== EVENT: MODE =====
      modeToggle.addEventListener('click', () => applyDarkMode(!isDark));

      // ===== TERMINAL =====
      function setTerminal(text, blink = false) {
        terminal.textContent = text;
        terminal.classList.toggle('blink', blink);
      }
      function setTerminalWithDots(text) {
        terminal.innerHTML = text + ' <span class="dots"></span>';
        terminal.classList.remove('blink');
      }

      // ===== VOTING LOGIC =====
      let isVoting = false;
      let voteTimeout = null;
      let voteStepTimeouts = [];

      function clearAllTimeouts() {
        if (voteTimeout) { clearTimeout(voteTimeout); voteTimeout = null; }
        voteStepTimeouts.forEach(t => clearTimeout(t));
        voteStepTimeouts = [];
      }

      function resetVoting() {
        clearAllTimeouts();
        isVoting = false;
        voteBtn.disabled = false;
        voteBtn.textContent = '🗳️ VOTING';
        terminal.classList.remove('blink');
        setTerminal('⏳ MENUNGGU PERINTAH...');
      }

      function startVoting() {
        if (isVoting) return;
        isVoting = true;
        voteBtn.disabled = true;
        voteBtn.textContent = '⏳ PROSES...';

        // Simpan edit text dulu kalau masih ada perubahan
        if (editArea.value.trim() !== (localStorage.getItem(EDIT_KEY) || '')) {
          saveEdit();
        }

        setTerminalWithDots('🔍 VALIDASI VOTE');
        voteStepTimeouts.push(setTimeout(() => setTerminalWithDots('📡 MENGHUBUNGI SERVER'), 800));
        voteStepTimeouts.push(setTimeout(() => setTerminalWithDots('🔄 MENGIRIM SUARA'), 1600));
        voteStepTimeouts.push(setTimeout(() => setTerminalWithDots('⚙️ MEMPROSES DATA'), 2400));

        voteTimeout = setTimeout(() => {
          const teksEdit = editArea.value.trim() || EDIT_DEFAULT;
          setTerminal('✅ VOTE BERHASIL! ' + teksEdit);
          terminal.classList.remove('blink');
          voteStepTimeouts.push(setTimeout(resetVoting, 3000));
          voteTimeout = null;
        }, 3200);
      }

      voteBtn.addEventListener('click', (e) => {
        e.preventDefault();
        startVoting();
      });

      // ===== INIT TERMINAL =====
      terminal.classList.remove('blink');
      setTerminal('⏳ MENUNGGU PERINTAH...');

      // Debug
      window.__nexaReset = resetVoting;
    })();
  </script>
</body>
